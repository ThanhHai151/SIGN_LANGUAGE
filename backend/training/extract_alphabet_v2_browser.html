<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Alphabet V2 Dense Extractor - VSL Connect AI</title>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
  <style>
    body { font-family: sans-serif; margin: 20px; }
    #status { padding: 10px; background: #eee; font-weight: bold; margin-bottom: 10px; }
    pre { background: #f8f8f8; padding: 10px; border: 1px solid #ddd; max-height: 400px; overflow: auto; }
  </style>
</head>
<body>
  <h2>VSL Connect AI - MediaPipe Hands 29 Chữ Cái Extractor V2</h2>
  <div id="status">INIT</div>
  <div id="progress">Chờ nạp tác vụ...</div>
  <pre id="output"></pre>
  <img id="worker-img" style="display:none;" />

  <script>
    async function processBatch() {
      const statusDiv = document.getElementById('status');
      const progDiv = document.getElementById('progress');
      const outPre = document.getElementById('output');
      const img = document.getElementById('worker-img');

      try {
        statusDiv.innerText = 'FETCHING_TASKS';
        const tasksRes = await fetch('/backend/data/alphabet_v2/current_batch_tasks.json');
        if (!tasksRes.ok) throw new Error('Không thể nạp current_batch_tasks.json');
        const tasks = await tasksRes.json();
        progDiv.innerText = `Đã nạp ${tasks.length} frame cần xử lý.`;

        statusDiv.innerText = 'INITIALIZING_MEDIAPIPE';
        const hands = new Hands({
          locateFile: (f) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${f}`
        });

        hands.setOptions({
          maxNumHands: 2,
          modelComplexity: 1,
          minDetectionConfidence: 0.5
        });

        await hands.initialize();
        statusDiv.innerText = 'MEDIAPIPE_READY';

        let lastResult = null;
        hands.onResults((res) => {
          lastResult = res;
        });

        const samples = [];
        let okCount = 0;
        let failCount = 0;

        for (let i = 0; i < tasks.length; i++) {
          const item = tasks[i];
          statusDiv.innerText = `PROCESSING_${i + 1}_OF_${tasks.length}`;
          progDiv.innerText = `[${i + 1}/${tasks.length}] ${item.letter_label} (Frame ${item.frame_index}) | OK: ${okCount}, NoHand: ${failCount}`;

          lastResult = null;
          img.src = item.frame_url;

          await new Promise((resolve, reject) => {
            img.onload = resolve;
            img.onerror = () => reject(new Error(`Không thể nạp frame: ${item.frame_url}`));
          });

          await hands.send({ image: img });

          let landmarks = null;
          let handedness = "Right";
          let confidence = 0.0;
          let qualityStatus = "no_hand_detected";

          if (lastResult && lastResult.multiHandLandmarks && lastResult.multiHandLandmarks.length > 0) {
            let chosenHandIdx = 0;

            if (lastResult.multiHandedness && lastResult.multiHandedness.length > 0) {
              confidence = lastResult.multiHandedness[0].score || 0.95;
              handedness = lastResult.multiHandedness[0].label || "Right";
            }

            const rawLms = lastResult.multiHandLandmarks[chosenHandIdx];
            if (rawLms && rawLms.length === 21) {
              landmarks = rawLms.map(p => [
                Math.round(p.x * 1e6) / 1e6,
                Math.round(p.y * 1e6) / 1e6,
                Math.round(p.z * 1e6) / 1e6
              ]);

              const isValid = landmarks.every(p => 
                p.length >= 3 && 
                Number.isFinite(p[0]) && 
                Number.isFinite(p[1]) && 
                Number.isFinite(p[2])
              );

              if (isValid) {
                qualityStatus = "ok";
                okCount++;
              } else {
                qualityStatus = "invalid_coordinate_values";
                landmarks = null;
                failCount++;
              }
            } else {
              qualityStatus = "invalid_point_count";
              failCount++;
            }
          } else {
            failCount++;
          }

          samples.push({
            letter_label: item.letter_label,
            video_id: item.video_id,
            source_video_file: item.source_video_file,
            frame_index: item.frame_index,
            timestamp_sec: item.timestamp_sec,
            signer_id: item.signer_id || "qipedc_signer_01",
            phase: item.phase || "unsegmented",
            handedness: handedness,
            confidence: Math.round(confidence * 10000) / 10000,
            coordinate_type: "normalized_mediapipe_hands",
            quality_status: qualityStatus,
            landmarks: landmarks
          });
        }

        statusDiv.innerText = 'BATCH_COMPLETE';
        progDiv.innerText = `Hoàn tất batch! Tổng: ${samples.length} | OK: ${okCount} | Thất bại: ${failCount}`;
        outPre.innerText = JSON.stringify(samples);
      } catch (err) {
        statusDiv.innerText = 'ERROR: ' + err.message;
        outPre.innerText = JSON.stringify({ error: err.message, samples: [] });
      }
    }

    window.addEventListener('load', processBatch);
  </script>
</body>
</html>
