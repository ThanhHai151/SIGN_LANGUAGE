name: Keep Render Alive

on:
  schedule:
    # Ping every 10 minutes to stay below Render Free's 15-minute idle spin-down
    - cron: "*/10 * * * *"
  workflow_dispatch:

concurrency:
  group: keep-render-alive
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping Render /healthz
        run: |
          URL="${{ vars.RENDER_HEALTH_URL || 'https://vsl-connect-ai.onrender.com/healthz' }}"
          BODY_FILE=$(mktemp)
          STATUS=$(curl -sS -o "$BODY_FILE" -w "%{http_code}" --max-time 90 --retry 3 --retry-delay 10 "$URL")
          echo "GET $URL -> HTTP $STATUS"
          cat "$BODY_FILE"
          echo ""
          rm -f "$BODY_FILE"
          if [ "$STATUS" -lt 200 ] || [ "$STATUS" -ge 400 ]; then
            exit 1
          fi

